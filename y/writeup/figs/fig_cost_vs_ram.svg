<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Weighted cost of the machine by RAM size">
<title>Weighted cost of the machine by RAM size</title>
<rect width="900" height="360" fill="#fcfcfb"/>
<text x="30.0" y="24.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Weighted cost (NAND + 6 DFF) of the whole machine, seed vs improved</text>
<text x="30.0" y="42.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">the improver saves 946 NAND at every RAM size; the RAM it needs to run (256 B) is what makes the machine big</text>
<line x1="90.0" y1="290.0" x2="870.0" y2="290.0" stroke="#e3e2de" stroke-width="1"/>
<text x="82.0" y="294.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">0</text>
<line x1="90.0" y1="216.7" x2="870.0" y2="216.7" stroke="#e3e2de" stroke-width="1"/>
<text x="82.0" y="220.7" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">10,000</text>
<line x1="90.0" y1="143.3" x2="870.0" y2="143.3" stroke="#e3e2de" stroke-width="1"/>
<text x="82.0" y="147.3" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">20,000</text>
<line x1="90.0" y1="70.0" x2="870.0" y2="70.0" stroke="#e3e2de" stroke-width="1"/>
<text x="82.0" y="74.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">30,000</text>
<rect x="133.0" y="248.7" width="44.0" height="41.3" rx="3" fill="#2a78d6" />
<text x="155.0" y="243.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">5,629</text>
<rect x="180.0" y="255.7" width="44.0" height="34.3" rx="3" fill="#1baf7a" />
<text x="202.0" y="250.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">4,683</text>
<text x="180.0" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">RAM 32 B</text>
<text x="180.0" y="324.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">-16.8%</text>
<text x="180.0" y="340.0" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="normal">too small for the improver</text>
<rect x="323.0" y="225.2" width="44.0" height="64.8" rx="3" fill="#2a78d6" />
<text x="345.0" y="220.2" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">8,843</text>
<rect x="370.0" y="232.1" width="44.0" height="57.9" rx="3" fill="#1baf7a" />
<text x="392.0" y="227.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">7,897</text>
<text x="370.0" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">RAM 64 B</text>
<text x="370.0" y="324.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">-10.7%</text>
<text x="370.0" y="340.0" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="normal">too small for the improver</text>
<rect x="513.0" y="177.9" width="44.0" height="112.1" rx="3" fill="#2a78d6" />
<text x="535.0" y="172.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">15,289</text>
<rect x="560.0" y="184.8" width="44.0" height="105.2" rx="3" fill="#1baf7a" />
<text x="582.0" y="179.8" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">14,343</text>
<text x="560.0" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">RAM 128 B</text>
<text x="560.0" y="324.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">-6.2%</text>
<text x="560.0" y="340.0" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="normal">too small for the improver</text>
<rect x="703.0" y="83.8" width="44.0" height="206.2" rx="3" fill="#2a78d6" />
<text x="725.0" y="78.8" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">28,119</text>
<rect x="750.0" y="90.7" width="44.0" height="199.3" rx="3" fill="#1baf7a" />
<text x="772.0" y="85.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">27,173</text>
<text x="750.0" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">RAM 256 B</text>
<text x="750.0" y="324.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">-3.4%</text>
<rect x="110.0" y="76.0" width="12.0" height="12.0" rx="2" fill="#2a78d6" />
<text x="128.0" y="87.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">seed (textbook)</text>
<rect x="240.0" y="76.0" width="12.0" height="12.0" rx="2" fill="#1baf7a" />
<text x="258.0" y="87.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">improved</text>
</svg>
