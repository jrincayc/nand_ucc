<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="ROM map of the Y machine, 16 KiB">
<title>ROM map of the Y machine, 16 KiB</title>
<rect width="900" height="300" fill="#fcfcfb"/>
<text x="30.0" y="24.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">ROM: 16,384 bytes (AB = 15), image 16,350 B</text>
<text x="30.0" y="42.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">bar = byte address from ROM_BASE; each segment is labelled with its size in bytes</text>
<rect x="30.0" y="60.0" width="254.8" height="46.0" rx="0" fill="#2a78d6" />
<rect x="284.8" y="60.0" width="408.0" height="46.0" rx="0" fill="#eb6834" />
<rect x="692.8" y="60.0" width="4.5" height="46.0" rx="0" fill="#eda100" />
<rect x="699.4" y="60.0" width="23.7" height="46.0" rx="0" fill="#1baf7a" />
<rect x="724.0" y="60.0" width="132.3" height="46.0" rx="0" fill="#6250d6" />
<rect x="856.3" y="60.0" width="11.9" height="46.0" rx="0" fill="#e87ba4" />
<rect x="868.3" y="60.0" width="1.7" height="46.0" rx="0" fill="#e3e2de" />
<line x1="30.0" y1="112.0" x2="870.0" y2="112.0" stroke="#e3e2de" stroke-width="1"/>
<line x1="30.0" y1="106.0" x2="30.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="30.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0 KiB</text>
<line x1="135.0" y1="106.0" x2="135.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="135.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">2 KiB</text>
<line x1="240.0" y1="106.0" x2="240.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="240.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">4 KiB</text>
<line x1="345.0" y1="106.0" x2="345.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="345.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">6 KiB</text>
<line x1="450.0" y1="106.0" x2="450.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="450.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">8 KiB</text>
<line x1="555.0" y1="106.0" x2="555.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="555.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">10 KiB</text>
<line x1="660.0" y1="106.0" x2="660.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="660.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">12 KiB</text>
<line x1="765.0" y1="106.0" x2="765.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="765.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">14 KiB</text>
<line x1="870.0" y1="106.0" x2="870.0" y2="118.0" stroke="#52514e" stroke-width="1"/>
<text x="870.0" y="132.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">16 KiB</text>
<rect x="40.0" y="157.0" width="14.0" height="14.0" rx="2" fill="#2a78d6" />
<text x="62.0" y="168.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">builder code</text>
<text x="330.0" y="168.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">4,970 B</text>
<text x="350.0" y="168.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">30.3%</text>
<rect x="40.0" y="178.0" width="14.0" height="14.0" rx="2" fill="#eb6834" />
<text x="62.0" y="189.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">improver code</text>
<text x="330.0" y="189.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">7,958 B</text>
<text x="350.0" y="189.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">48.6%</text>
<rect x="40.0" y="199.0" width="14.0" height="14.0" rx="2" fill="#eda100" />
<text x="62.0" y="210.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">improver tables</text>
<text x="330.0" y="210.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">87 B</text>
<text x="350.0" y="210.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">0.5%</text>
<rect x="40.0" y="220.0" width="14.0" height="14.0" rx="2" fill="#1baf7a" />
<text x="62.0" y="231.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">HD: directory + records</text>
<text x="330.0" y="231.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">462 B</text>
<text x="350.0" y="231.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">2.8%</text>
<rect x="40.0" y="241.0" width="14.0" height="14.0" rx="2" fill="#6250d6" />
<text x="62.0" y="252.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">HD: body (instances)</text>
<text x="330.0" y="252.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">2,581 B</text>
<text x="350.0" y="252.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">15.8%</text>
<rect x="40.0" y="262.0" width="14.0" height="14.0" rx="2" fill="#e87ba4" />
<text x="62.0" y="273.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">HD: chain + ports</text>
<text x="330.0" y="273.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">233 B</text>
<text x="350.0" y="273.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">1.4%</text>
<rect x="40.0" y="283.0" width="14.0" height="14.0" rx="2" fill="#e3e2de" />
<text x="62.0" y="294.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">free</text>
<text x="330.0" y="294.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">34 B</text>
<text x="350.0" y="294.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">0.2%</text>
<text x="440.0" y="168.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the improver is 61% of the code and 48% of the whole ROM;</text>
<text x="440.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the description (HD) is 20%, of which the body of 471 instances is 2,581 B.</text>
<text x="440.0" y="214.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the HD is data that the ROM also copies into every child,</text>
<text x="440.0" y="232.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">except the records, which the builder re-programs after improving them.</text>
</svg>
