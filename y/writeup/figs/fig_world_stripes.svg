<text x="890.0" y="347.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">RAM tiles</text>
<text x="165.0" y="347.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">14,549 NAND + 2,104 DFF placed in this stripe (generation 4: all parts placed, wiring in progress at tick 200 M)</text>
