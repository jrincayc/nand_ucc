<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="World layout: one stripe per generation">
<title>World layout: one stripe per generation</title>
<rect width="1000" height="380" fill="#fcfcfb"/>
<text x="30.0" y="24.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The world after generation 2 has built generation 3 (tick 200 M): one 140-cell stripe per generation</text>
<text x="30.0" y="42.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">schematic (not to scale): per stripe the arm, the ROM, the core row (2,239 nodes, 2 cells each) and the RAM block (256 columns x 60 rows)</text>
<text x="30.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">gen 1</text>
<text x="30.0" y="102.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">y = 140</text>
<rect x="100.0" y="70.0" width="18.0" height="18.0" rx="2" fill="#eda100" />
<text x="109.0" y="103.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">arm</text>
<rect x="124.0" y="70.0" width="30.0" height="18.0" rx="2" fill="#6250d6" />
<text x="139.0" y="103.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">ROM</text>
<rect x="165.0" y="76.0" width="640.0" height="6.0" rx="0" fill="#2a78d6" />
<text x="485.0" y="103.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">core row</text>
<rect x="830.0" y="66.0" width="120.0" height="46.0" rx="3" fill="#1baf7a" />
<text x="890.0" y="122.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">RAM tiles</text>
<text x="165.0" y="122.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">15,495 NAND + 2,104 DFF placed in this stripe</text>
<text x="30.0" y="159.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">gen 2</text>
<text x="30.0" y="177.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">y = 280</text>
<rect x="100.0" y="145.0" width="18.0" height="18.0" rx="2" fill="#eda100" />
