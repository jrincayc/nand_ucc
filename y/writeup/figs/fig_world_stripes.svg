<rect x="830.0" y="216.0" width="120.0" height="46.0" rx="3" fill="#1baf7a" />
<text x="890.0" y="272.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">RAM tiles</text>
<text x="165.0" y="272.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">14,549 NAND + 2,104 DFF placed in this stripe</text>
