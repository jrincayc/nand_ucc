<rect x="124.0" y="295.0" width="30.0" height="18.0" rx="2" fill="#6250d6" />
<text x="139.0" y="328.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">ROM</text>
<rect x="165.0" y="301.0" width="640.0" height="6.0" rx="0" fill="#2a78d6" />
<text x="485.0" y="328.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">core row</text>
