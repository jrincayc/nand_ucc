<svg xmlns='http://www.w3.org/2000/svg' width='905' height='402' viewBox='0 0 905 402' font-family='Helvetica, Arial, sans-serif'><rect width='100%' height='100%' fill='#ffffff'/><text x='20' y='26' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Anatomy of every replicator in this report</text><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#444'/></marker></defs><rect x='14' y='44' width='500' height='300' rx='10' fill='#f6f5f1' stroke='#999' stroke-dasharray='0'/><text x='26' y='64' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>parent machine (built of NAND, DFF and copper)</text><rect x='30' y='80' width='210' height='120' rx='6' fill='#e3f1e7' stroke='#555' stroke-width='1'/><text x='40' y='100' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold'>program store (ROM)</text><text x='40' y='118' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>builder code</text><text x='40' y='134' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>description of the machine</text><text x='40' y='150' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>(netlist, modules or layout)</text><text x='40' y='166' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>X-R4: a ROM part; R5, R6: gates</text><rect x='290' y='80' width='210' height='80' rx='6' fill='#e6ecf4' stroke='#555' stroke-width='1'/><text x='300' y='100' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold'>CPU</text><text x='300' y='118' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Hack-vN(-AB), RV32EC,</text><text x='300' y='134' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>or a pruned sequencer (R5)</text><rect x='290' y='190' width='210' height='60' rx='6' fill='#efe8f7' stroke='#555' stroke-width='1'/><text x='300' y='210' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold'>RAM</text><text x='300' y='228' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>part, or NAND/DFF tiles</text><rect x='30' y='230' width='210' height='96' rx='6' fill='#f7e3e1' stroke='#555' stroke-width='1'/><text x='40' y='250' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold'>ARM (robot arm)</text><text x='40' y='268' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>memory-mapped, write-only</text><text x='40' y='284' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>PLACE, PROGRAM_ROM,</text><text x='40' y='300' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>WIRE (RNDW) / TRACK, VIA (RNDP)</text><line x1='240' y1='120' x2='288' y2='120' stroke='#444' stroke-width='1.6' marker-end='url(#ah)'/><text x='264.0' y='114.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal'>fetch</text><line x1='395' y1='160' x2='395' y2='188' stroke='#444' stroke-width='1.6' marker-end='url(#ah)'/><line x1='290' y1='140' x2='242' y2='260' stroke='#444' stroke-width='1.6' marker-end='url(#ah)'/><text x='276' y='214' font-size='11' fill='#52514e' text-anchor='end' font-weight='normal'>register</text><text x='276' y='228' font-size='11' fill='#52514e' text-anchor='end' font-weight='normal'>writes</text><rect x='560' y='44' width='330' height='300' rx='10' fill='#ffffff' stroke='#999' stroke-dasharray='5 4'/><text x='574' y='64' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>child machine (being built, held in reset)</text><text x='578' y='96' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>1. PLACE every part</text><text x='578' y='122' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>2. PROGRAM_ROM: copy the image (if a ROM part)</text><text x='578' y='148' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>3. lay every wire / copper track and via</text><text x='578' y='174' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>4. connect the child arm EN</text><text x='578' y='200' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>5. connect RUN last: the child starts</text><text x='578' y='226' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='normal'>   ... and builds the grandchild</text><line x1='240' y1='290' x2='556' y2='200' stroke='#444' stroke-width='1.6' marker-end='url(#ah)'/><text x='398.0' y='267.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal'>arm commands</text><text x='20' y='372' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Quine check: the child equals the parent shifted by a constant offset (parts, copper or wires, vias, ROM bytes).</text><text x='20' y='390' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Improvers (Y, R4) instead build a smaller or re-laid-out child, which then rebuilds itself unchanged (a fixed point).</text></svg>